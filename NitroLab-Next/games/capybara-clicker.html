<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capybara Clicker · NitroArcade</title><style>body{background:#0b1023;color:white;font:16px system-ui;margin:20px}input{width:min(600px,90%);padding:12px;background:#202949;color:white;border:1px solid #8beaff}button{padding:12px;background:#724ac0;color:white;border:0;cursor:pointer}iframe{display:block;margin-top:20px;width:100%;height:70vh;border:3px solid #8beaff;border-radius:12px}a{color:#aef}</style></head><body><a href="../index.html">← NitroLab</a><h1>Capybara Clicker</h1><p>Paste the exact Capybara Clicker embed URL that your team confirmed works. It will be remembered on this browser. This game requires internet unless you have an authorized offline copy.</p><input id="url" placeholder="https://..." aria-label="Verified embed URL"><button id="go">Load game</button><p id="status"></p><iframe id="game" title="Capybara Clicker" allowfullscreen referrerpolicy="no-referrer"></iframe><script>const u=document.getElementById('url'),f=document.getElementById('game'),s=document.getElementById('status');u.value=localStorage.getItem('nitro_capybara_url')||'';document.getElementById('go').onclick=()=>{try{const v=new URL(u.value);if(!['https:','http:'].includes(v.protocol))throw Error();f.src=v.href;localStorage.setItem('nitro_capybara_url',v.href);s.textContent='If the frame stays blank, this URL may block embedding.'}catch(e){s.textContent='Enter a valid http(s) URL.'}};if(u.value)document.getElementById('go').click()</script></body></html>

<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Neon Dodge</title><link rel="stylesheet" href="../styles/next.css"><main><a href="../index.html">← Portal</a><h1>Neon Dodge</h1><p>Move with ← → or A/D. Avoid falling blocks. Press Restart to play again.</p><p id="score">Score: 0</p><canvas id="game" width="560" height="380"></canvas><p><button onclick="location.reload()">Restart</button></p></main><script src="../engine/nitro-engine.js"></script><script>const g=new NitroEngine(game),player=g.add({x:265,y:335,w:30,h:30,color:'#7deaff'});let scoreN=0,spawn=0,over=false;g.start((dt,e)=>{if(over)return;if(e.keys.has('arrowleft')||e.keys.has('a'))player.x-=270*dt;if(e.keys.has('arrowright')||e.keys.has('d'))player.x+=270*dt;player.x=Math.max(0,Math.min(530,player.x));spawn-=dt;if(spawn<=0){spawn=.38;e.add({x:Math.random()*525,y:-22,w:20+Math.random()*20,h:20,color:'#f16fba',hazard:true,update(d){this.y+=(160+scoreN/8)*d;if(this.y>380){this.dead=true;scoreN++;score.textContent='Score: '+scoreN}}})}for(const x of e.entities)if(x.hazard&&e.overlap(player,x)){over=true;e.running=false;score.textContent='Game over! Score: '+scoreN}})</script></html>

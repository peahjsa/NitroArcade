<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goat Chaos · NitroArcade</title><style>*{box-sizing:border-box}body{margin:0;background:#080d20;color:#f4f4ff;font:15px system-ui}header{padding:12px 16px;background:#10172c;display:flex;flex-wrap:wrap;gap:12px;align-items:center}button,a{background:#392367;border:1px solid #9b7cff;color:#fff;padding:8px 12px;border-radius:7px;cursor:pointer}canvas{display:block;width:100%;height:calc(100vh - 90px);min-height:370px;touch-action:none}small{color:#d6c6ff}</style></head><body><header><b>🐐 GOAT CHAOS · PLAYABLE 2D MODE</b><small>WASD / arrows: move · collect gems · bump crates · R: reset</small><span id="score">Gems: 0</span><button onclick="reset()">Reset</button><a href="goat-3d-experimental.html">Try experimental 3D</a></header><canvas id="game"></canvas><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let w=0,h=0,goat={x:0,y:0},score=0,keys={};const gems=[],crates=[];function resize(){w=canvas.width=canvas.clientWidth;h=canvas.height=canvas.clientHeight}addEventListener('resize',resize);resize();function reset(){goat={x:0,y:0};score=0;gems.length=0;crates.length=0;for(let i=0;i<25;i++)gems.push({x:(Math.random()-.5)*1450,y:(Math.random()-.5)*1050});for(let i=0;i<14;i++)crates.push({x:(Math.random()-.5)*1300,y:(Math.random()-.5)*950});document.getElementById('score').textContent='Gems: 0'}reset();addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if('wasdarrowuparrowdownarrowleftarrowright'.includes(e.key.toLowerCase()))e.preventDefault();if(e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let last=performance.now();function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;const speed=240*dt;let dx=Number(keys.d||keys.arrowright)-Number(keys.a||keys.arrowleft),dy=Number(keys.s||keys.arrowdown)-Number(keys.w||keys.arrowup);const mag=Math.hypot(dx,dy)||1;goat.x+=dx/mag*speed;goat.y+=dy/mag*speed;ctx.fillStyle='#8fc5df';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(w/2-goat.x,h/2-goat.y);ctx.fillStyle='#86b76e';ctx.fillRect(-1100,-850,2200,1700);ctx.strokeStyle='#6c9d58';ctx.lineWidth=2;for(let x=-1100;x<=1100;x+=80){ctx.beginPath();ctx.moveTo(x,-850);ctx.lineTo(x,850);ctx.stroke()}for(let y=-850;y<=850;y+=80){ctx.beginPath();ctx.moveTo(-1100,y);ctx.lineTo(1100,y);ctx.stroke()}ctx.fillStyle='#4c9bc5';ctx.beginPath();ctx.ellipse(420,-230,180,120,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#c5a474';for(let i=0;i<8;i++)ctx.fillRect(-800+i*170,340+(i%2)*90,100,85);for(const c of crates){if(Math.hypot(c.x-goat.x,c.y-goat.y)<40){c.x+=(c.x-goat.x)*.12;c.y+=(c.y-goat.y)*.12}ctx.fillStyle='#a16b38';ctx.fillRect(c.x-19,c.y-19,38,38);ctx.strokeStyle='#5d381b';ctx.strokeRect(c.x-19,c.y-19,38,38)}for(let i=gems.length-1;i>=0;i--){const g=gems[i];if(Math.hypot(g.x-goat.x,g.y-goat.y)<28){gems.splice(i,1);score+=10;document.getElementById('score').textContent='Score: '+score;continue}ctx.fillStyle='#e9ed40';ctx.beginPath();ctx.moveTo(g.x,g.y-12);ctx.lineTo(g.x+10,g.y);ctx.lineTo(g.x,g.y+12);ctx.lineTo(g.x-10,g.y);ctx.fill()}ctx.fillStyle='#f2ede0';ctx.beginPath();ctx.ellipse(goat.x,goat.y,22,15,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#7b5b3b';ctx.fillRect(goat.x-16,goat.y-18,7,12);ctx.fillRect(goat.x+9,goat.y-18,7,12);ctx.fillStyle='#1c2334';ctx.fillRect(goat.x+8,goat.y-4,4,4);ctx.restore();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>

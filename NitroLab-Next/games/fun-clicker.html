<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Fun Clicker • NitroArcade</title><style>body{background:#101126;color:#eee;font:16px system-ui;margin:20px}main{max-width:1100px;margin:auto}input{width:70%;padding:12px;background:#1d2045;color:white;border:1px solid #b38cff}button{padding:12px;background:#6a37dc;color:white;border:0;cursor:pointer}iframe{display:block;width:100%;height:70vh;border:3px solid #8b6dff;border-radius:12px;margin-top:20px}</style><main><a href="../index.html">← NitroLab</a><h1>Fun Clicker — Horror Version</h1><p>Use the original creator's authorized embeddable player URL. The game is not bundled and needs internet. Some sites block embedding.</p><label>Verified player URL: <input id="url" type="url" placeholder="https://…" autocomplete="url"></label><button id="go">Load</button><button id="clear">Forget URL</button><p id="msg" role="status"></p><iframe id="game" title="Fun Clicker" allowfullscreen referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms"></iframe><p>Content note: horror themes and possible jump scares. Credit belongs to the original game creator.</p></main><script>const u=document.querySelector('#url'),f=document.querySelector('#game'),m=document.querySelector('#msg');u.value=localStorage.getItem('nitro.fun.url')||'';document.querySelector('#go').onclick=()=>{try{const v=new URL(u.value);if(!['https:','http:'].includes(v.protocol))throw 0;localStorage.setItem('nitro.fun.url',v.href);f.src=v.href;m.textContent='If blank, the website may block iframes.'}catch{m.textContent='Enter a valid http(s) embed URL.'}};document.querySelector('#clear').onclick=()=>{localStorage.removeItem('nitro.fun.url');u.value='';f.removeAttribute('src');m.textContent='Saved URL cleared.'}</script></html>

<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Nitro Clicker</title><link rel="stylesheet" href="../styles/next.css"><main><a href="../index.html">← Portal</a><h1>Nitro Clicker</h1><img class="mascot" src="../assets/mascots/pixie.svg" alt="Pixie"><p id="points">0 NitroPoints</p><button id="click" class="giant">CLICK THE CRYSTAL</button><p><button id="buy">Buy auto-clicker (20)</button> <button id="boost">Upgrade click (+1) (50)</button></p><p id="stats"></p><button id="reset">Reset save</button></main><script>let s;try{s=JSON.parse(localStorage.getItem('nitro-clicker-v1'))||{points:0,auto:0,power:1}}catch{s={points:0,auto:0,power:1}};const save=()=>{try{localStorage.setItem('nitro-clicker-v1',JSON.stringify(s))}catch{};render()},render=()=>{points.textContent=Math.floor(s.points)+' NitroPoints';stats.textContent='Auto-clickers: '+s.auto+' | Points per click: '+s.power};click.onclick=()=>{s.points+=s.power;save()};buy.onclick=()=>{if(s.points>=20){s.points-=20;s.auto++;save()}};boost.onclick=()=>{if(s.points>=50){s.points-=50;s.power++;save()}};reset.onclick=()=>{if(confirm('Reset clicker progress?')){s={points:0,auto:0,power:1};save()}};setInterval(()=>{if(s.auto){s.points+=s.auto;save()}},1000);render()</script></html>

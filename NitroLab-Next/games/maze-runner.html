<!doctype html><html><meta charset="utf-8"><title>Nitro Maze Runner</title><style>body{background:#0d0b23;color:#eee;font:16px system-ui;text-align:center}canvas{border:3px solid #9a6dff;max-width:95vw;image-rendering:pixelated}button{padding:10px;background:#7642e9;color:white;border:0}</style><a href="../index.html">← NitroLab</a><h1>Maze Runner</h1><p>WASD / arrows · Reach the cyan exit</p><button id="new">New maze</button><p id="status"></p><canvas id="c" width="630" height="450"></canvas><script type="module">import {makeMaze} from '../experimental/advanced/procedural-world-engine/maze.js';const c=document.querySelector('canvas'),ctx=c.getContext('2d'),status=document.querySelector('#status');let maze,x,y,seed=12;function reset(){maze=makeMaze(21,15,seed++);x=y=1;draw()}function draw(){ctx.fillStyle='#0b0a1a';ctx.fillRect(0,0,630,450);for(let j=0;j<15;j++)for(let i=0;i<21;i++){ctx.fillStyle=maze[j][i]?'#392c73':'#171d3d';ctx.fillRect(i*30,j*30,29,29)}ctx.fillStyle='#46e9e6';ctx.fillRect(19*30+5,13*30+5,20,20);ctx.fillStyle='#ffc4ff';ctx.fillRect(x*30+5,y*30+5,20,20);if(x===19&&y===13)status.textContent='Maze cleared! Try another.'}document.onkeydown=e=>{const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};const d=m[e.key];if(!d)return;e.preventDefault();const nx=x+d[0],ny=y+d[1];if(maze[ny]?.[nx]===0){x=nx;y=ny;draw()}};document.querySelector('#new').onclick=()=>{status.textContent='';reset()};reset();</script></html>

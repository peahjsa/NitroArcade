<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Pixel Catcher</title><link rel="stylesheet" href="../styles/next.css"><main><a href="../index.html">← Portal</a><h1>Pixel Catcher</h1><p>Move with ← → or A/D. Catch the golden falling squares!</p><p id="score">Caught: 0</p><canvas id="game" width="560" height="380"></canvas><p><button onclick="location.reload()">Restart</button></p></main><script src="../engine/nitro-engine.js"></script><script>const e=new NitroEngine(game),p=e.add({x:255,y:340,w:70,h:20,color:'#a78bfa'});let n=0,t=0;e.start((dt,g)=>{if(g.keys.has('arrowleft')||g.keys.has('a'))p.x-=300*dt;if(g.keys.has('arrowright')||g.keys.has('d'))p.x+=300*dt;p.x=Math.max(0,Math.min(490,p.x));t-=dt;if(t<=0){t=.75;g.add({x:Math.random()*530,y:-20,w:18,h:18,color:'#f9e68a',fall:true,update(d){this.y+=165*d;if(this.y>380)this.dead=true}})}for(const x of g.entities)if(x.fall&&g.overlap(p,x)){x.dead=true;n++;score.textContent='Caught: '+n}})</script></html>

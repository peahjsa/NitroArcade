<script>
const games=[];

const sets={

 "Nitro City","Future Racer","Sky Road","Midnight Racer","Rocket Wheels",
 "Chrome Storm","Velocity X","Digital Speedway","Neon Grand Prix","Turbo Tunnel",
 "Quantum Racer","Laser Track","Mega Drift","Electric Road","Ultimate Drive"
 ],
 shooting:[
 "Target Storm","Laser Strike","Alien Hunter","Drone Defense","Cyber Sniper",
 "Meteor Blaster","Space Shooter","Robot Attack","Cannon Zone","Plasma Fire",
 "Target Hunter","Star Defender","Enemy Rush","Laser Arena","Battle Grid",
 "Cosmic Strike","Pulse Shooter","Galaxy Defense","Titan Blaster","Rapid Fire"
 ],
 maze:[
 "Neon Maze","Crystal Maze","Cyber Labyrinth","Dark Maze","Gold Runner",
 "Laser Maze","Future Labyrinth","Blue Maze","Red Maze","Infinite Maze",
 "Robot Maze","Shadow Maze","Portal Maze","Electric Maze","Speed Maze",
 "Secret Maze","Diamond Maze","Castle Maze","Space Maze","Ultimate Maze"
 ],
 reaction:[
 "Lightning Reaction","Color Reflex","Quick Click","Flash Reflex","Speed Tap",
 "Instant Reaction","Red Green","Pulse Reaction","Rapid Reflex","Blink Test",
 "Hyper Tap","Cyber Reflex","Zero Delay","Fast Hands","Reaction Master",
 "Signal Rush","Click Storm","Reflex Arena","Speed Brain","Ultimate Reflex"
 ],
 hacker:[
 "Cyber Terminal","Code Breaker","Digital Vault","Firewall Puzzle","Matrix Console",
 "Encrypted Door","Security Grid","Data Vault","Password Lab","Cyber Lock",
 "System Puzzle","Code Tunnel","Virtual Terminal","Cipher Room","Digital Safe",
 "Network Maze","Secret Console","Logic Terminal","Binary Vault","Master Hacker"
 ],
 puzzle:[
 "Guess The Number","Memory Grid","Math Rush","Color Puzzle","Pattern Match",
 "Number Storm","Tile Master","Quick Math","Sequence Lab","Brain Box",
 "Logic Blocks","Shape Match","Memory Flash","Puzzle Zone","Equation Rush",
 "Smart Grid","Brain Arena","Pattern Rush","Mind Challenge","Ultimate Puzzle"
 ],
 arcade:[
 "Dodge Blast","Coin Rush","Meteor Dodge","Orb Collector","Pixel Runner",
 "Sky Dodge","Neon Survival","Star Catcher","Rocket Escape","Laser Dodge",
 "Falling Blocks","Energy Rush","Cyber Runner","Gravity Ball","Astro Dodge",
 "Diamond Dash","Fireball Escape","Speed Collector","Infinite Runner","Survival X"
 ],
 strategy:[
 "Tower Defense","Base Defender","Grid Commander","Robot Defense","Crystal Guard",
 "Castle Defense","Cyber Defense","Laser Towers","Alien Base","Battle Grid",
 "Fortress Guard","Space Command","Neon Defense","Defense Master","Ultimate Commander"
 ],
 sports:[
 "Target Soccer","Basketball Shot","Tennis Target","Hockey Aim","Football Kick",
 "Baseball Hit","Golf Precision","Boxing Reflex","Bowling Strike","Sports Master"
 ]
};

let id=1;
for(const type in sets){
 for(const name of sets[type]){
  games.push({
   id:id++,
   name,
   type,
   desc:description(type)
  });
 }
}

function description(type){
 const d={
  racing:"Drive at high speed, dodge traffic and chase the fastest score.",
  shooting:"Aim carefully and destroy targets before time runs out.",
  maze:"Find the glowing gold objective while navigating the maze.",
  reaction:"Test your reaction speed and click at exactly the right moment.",
  hacker:"A fictional arcade hacking puzzle. Crack the sequence before time ends.",
  puzzle:"Use your brain to solve the challenge and beat your score.",
  arcade:"Survive, dodge, collect and become the arcade champion.",
  strategy:"Build defenses and stop enemies from reaching your base.",
  sports:"Test your timing and precision in a fast sports challenge."
 };
 return d[type];
}

const grid=document.getElementById("grid");
const count=document.getElementById("count");

function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const f=document.getElementById("filter").value;

 const list=games.filter(g=>
  (f==="all"||g.type===f)&&
  (g.name.toLowerCase().includes(q)||g.type.includes(q))
 );

 count.textContent=`${list.length} GAMES AVAILABLE`;

 grid.innerHTML=list.map(g=>`
 <div class="card" onclick="openGame(${g.id})">
   <div class="num">GAME #${g.id}</div>
   <h3>🎮 ${g.name}</h3>
   <span class="type">${g.type.toUpperCase()}</span>
   <div class="desc">${g.desc}</div>
 </div>
 `).join("");
}

document.getElementById("search").oninput=render;
document.getElementById("filter").onchange=render;

function randomGame(){
 const g=games[Math.floor(Math.random()*games.length)];
 openGame(g.id);
}

function openGame(id){
 const g=games.find(x=>x.id===id);
 document.getElementById("modal").style.display="flex";
 document.getElementById("gameTitle").textContent=`GAME #${g.id} — ${g.name}`;
 document.getElementById("gameInfo").textContent=g.desc;
 startGame(g.type);
}

function closeGame(){
 document.getElementById("modal").style.display="none";
 if(window.gameLoop)cancelAnimationFrame(window.gameLoop);
}

function area(){
 const a=document.getElementById("gameArea");
 a.innerHTML="";
 return a;
}

/* ---------------- RACING ---------------- */

function racing(){
 const a=area();

 a.innerHTML=`
 <canvas id="game" width="900" height="520"></canvas>
 <div class="big">⬅️ ➡️ STEER &nbsp; | &nbsp; SPACE = BOOST</div>
 `;

 const c=document.getElementById("game");
 const x=c.getContext("2d");

 let car={x:450,y:420,w:55,h:95};
 let enemies=[];
 let score=0;
 let lives=3;
 let speed=6;
 let keys={};

 document.onkeydown=e=>keys[e.key.toLowerCase()]=true;
 document.onkeyup=e=>keys[e.key.toLowerCase()]=false;

 for(let i=0;i<5;i++){
  enemies.push({
   x:310+Math.random()*280,
   y:-Math.random()*800,
   w:48,h:85
  });
 }

 function draw(){
  x.fillStyle="#03040b";
  x.fillRect(0,0,900,520);

  // road
  x.fillStyle="#151822";
  x.fillRect(260,0,380,520);

  // road glow
  x.strokeStyle="#16dfff";
  x.lineWidth=5;
  x.strokeRect(260,0,380,520);

  // lane lines
  x.strokeStyle="#777";
  x.lineWidth=3;
  x.setLineDash([30,30]);
  x.beginPath();
  x.moveTo(450,0);
  x.lineTo(450,520);
  x.moveTo(355,0);
  x.lineTo(355,520);
  x.moveTo(545,0);
  x.lineTo(545,520);
  x.stroke();
  x.setLineDash([]);

  // stars
  for(let i=0;i<40;i++){
   x.fillStyle="#fff";
   x.fillRect((i*137)%900,(i*71)%520,2,2);
  }

  if(keys["arrowleft"]||keys["a"])car.x-=7;
  if(keys["arrowright"]||keys["d"])car.x+=7;
  if(keys[" "]){
   speed=11;
  }else speed=6;

  car.x=Math.max(280,Math.min(565,car.x));

  // player car
  x.save();
  x.translate(car.x,car.y);
  x.shadowBlur=25;
  x.shadowColor="#00eaff";
  x.fillStyle="#08dfff";
  x.roundRect(-27,-47,54,94,12);
  x.fill();
  x.fillStyle="#07122b";
  x.fillRect(-18,-27,36,30);
  x.fillStyle="#ffec5c";
  x.fillRect(-22,-45,12,8);
  x.fillRect(10,-45,12,8);
  x.fillStyle="#ff315d";
  x.fillRect(-22,35,12,8);
  x.fillRect(10,35,12,8);
  x.restore();

  enemies.forEach(e=>{
   e.y+=speed;
   if(e.y>570){
    e.y=-100;
    e.x=285+Math.random()*300;
    score+=10;
   }

   x.fillStyle="#ff275d";
   x.shadowBlur=20;
   x.shadowColor="#ff0055";
   x.fillRect(e.x,e.y,e.w,e.h);
   x.shadowBlur=0;

   if(
    car.x-27<e.x+e.w &&
    car.x+27>e.x &&
    car.y-47<e.y+e.h &&
    car.y+47>e.y
   ){
    lives--;
    e.y=-100;
    if(lives<=0){
     alert("GAME OVER! Score: "+score);
     closeGame();
    }
   }
  });

  x.fillStyle="#fff";
  x.font="22px Arial";
  x.fillText("SCORE: "+score,20,35);
  x.fillText("LIVES: "+lives,20,65);

  gameLoop=requestAnimationFrame(draw);
 }
 draw();
}

/* ---------------- SHOOTING ---------------- */

function shooting(){
 const a=area();
 a.innerHTML=`
 <canvas id="game" width="900" height="520"></canvas>
 <div class="big">🖱️ CLICK THE TARGETS!</div>
 `;

 const c=document.getElementById("game");
 const x=c.getContext("2d");

 let target={x:450,y:260,r:35};
 let score=0;
 let time=30;

 c.onclick=e=>{
  const r=c.getBoundingClientRect();
  const mx=(e.clientX-r.left)*c.width/r.width;
  const my=(e.clientY-r.top)*c.height/r.height;
  const d=Math.hypot(mx-target.x,my-target.y);

  if(d<target.r){
   score++;
   target.r=20+Math.random()*35;
   target.x=target.r+Math.random()*(900-target.r*2);
   target.y=target.r+Math.random()*(520-target.r*2);
  }
 };

 const timer=setInterval(()=>{
  time--;
  if(time<=0){
   clearInterval(timer);
   alert("TIME UP! Targets hit: "+score);
   closeGame();
  }
 },1000);

 function draw(){
  x.fillStyle="#03050d";
  x.fillRect(0,0,900,520);

  for(let i=0;i<50;i++){
   x.fillStyle="#20345e";
   x.fillRect((i*97)%900,(i*53)%520,2,2);
  }

  x.beginPath();
  x.arc(target.x,target.y,target.r,0,Math.PI*2);
  x.fillStyle="#ff164f";
  x.shadowBlur=30;
  x.shadowColor="#ff164f";
  x.fill();
  x.shadowBlur=0;

  x.beginPath();
  x.arc(target.x,target.y,target.r*.55,0,Math.PI*2);
  x.fillStyle="#fff";
  x.fill();

  x.beginPath();
  x.arc(target.x,target.y,target.r*.2,0,Math.PI*2);
  x.fillStyle="#ff164f";
  x.fill();

  x.fillStyle="#fff";
  x.font="25px Arial";
  x.fillText("SCORE: "+score,20,35);
  x.fillText("TIME: "+time,760,35);

  gameLoop=requestAnimationFrame(draw);
 }
 draw();
}

/* ---------------- MAZE ---------------- */

function maze(){
 const a=area();

 a.innerHTML=`
 <canvas id="game" width="720" height="520"></canvas>
 <div class="big">🎯 Reach the GOLD circle • WASD / ARROW KEYS</div>
 `;

 const c=document.getElementById("game");
 const x=c.getContext("2d");

 const cols=18,rows=13;
 const cw=c.width/cols,ch=c.height/rows;

 let player={x:1,y:1};
 let goal={x:cols-2,y:rows-2};

 let walls=[];

 for(let y=0;y<rows;y++){
  for(let xx=0;xx<cols;xx++){
   if(
    xx===0||y===0||xx===cols-1||y===rows-1||
    (Math.random()<.23 && !(xx<4&&y<4)&&!(xx>cols-5&&y>rows-5))
   ){
    walls.push({x:xx,y});
   }
  }
 }

 // Clear start and finish
 walls=walls.filter(w=>
  !(w.x<3&&w.y<3)&&
  !(w.x>cols-4&&w.y>rows-4)
 );

 document.onkeydown=e=>{
  let nx=player.x,ny=player.y;

  if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")ny--;
  if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")ny++;
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")nx--;
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")nx++;

  if(!walls.some(w=>w.x===nx&&w.y===ny)){
   player.x=nx;
   player.y=ny;
  }

  if(player.x===goal.x&&player.y===goal.y){
   alert("🏆 MAZE COMPLETE!");
   closeGame();
  }
 };

 function draw(){
  x.fillStyle="#02040b";
  x.fillRect(0,0,c.width,c.height);

  for(let y=0;y<rows;y++){
   for(let xx=0;xx<cols;xx++){
    x.strokeStyle="#18275c";
    x.strokeRect(xx*cw,y*ch,cw,ch);
   }
  }

  walls.forEach(w=>{
   x.fillStyle="#263cff";
   x.shadowBlur=12;
   x.shadowColor="#174cff";
   x.fillRect(w.x*cw+2,w.y*ch+2,cw-4,ch-4);
   x.shadowBlur=0;
  });

  x.beginPath();
  x.arc(
   goal.x*cw+cw/2,
   goal.y*ch+ch/2,
   Math.min(cw,ch)*.32,
   0,Math.PI*2
  );
  x.fillStyle="#ffd21f";
  x.shadowBlur=25;
  x.shadowColor="#ffd21f";
  x.fill();
  x.shadowBlur=0;

  x.fillStyle="#00eaff";
  x.shadowBlur=20;
  x.shadowColor="#00eaff";
  x.beginPath();
  x.arc(
   player.x*cw+cw/2,
   player.y*ch+ch/2,
   Math.min(cw,ch)*.3,
   0,Math.PI*2
  );
  x.fill();
  x.shadowBlur=0;

  gameLoop=requestAnimationFrame(draw);
 }
 draw();
}

/* ---------------- REACTION ---------------- */

function reaction(){
 const a=area();

 a.innerHTML=`
 <div id="reactionBox"
 style="
 height:400px;
 border-radius:20px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:40px;
 font-weight:bold;
 background:#181b2a;
 cursor:pointer;">
 WAIT...
 </div>
 <div class="big">Click when the box becomes GREEN!</div>
 `;

 const box=document.getElementById("reactionBox");
 let start;
 let ready=false;
 let timer;

 function prepare(){
  box.style.background="#b5163d";
  box.textContent="WAIT...";
  ready=false;

  timer=setTimeout(()=>{
   box.style.background="#00a86b";
   box.textContent="CLICK!";
   start=performance.now();
   ready=true;
  },1000+Math.random()*3500);
 }

 box.onclick=()=>{
  if(ready){
   let ms=Math.round(performance.now()-start);
   box.textContent=ms+" ms";
   if(ms<250)box.innerHTML+="<br><span class='green'>LIGHTNING!</span>";
   else box.innerHTML+="<br>Good reaction!";
   setTimeout(prepare,1500);
  }else{
   clearTimeout(timer);
   box.textContent="TOO EARLY!";
   setTimeout(prepare,1200);
  }
 };

 prepare();
}

/* ---------------- HACKER ---------------- */

function hacker(){
 const a=area();

 const code=Math.floor(1000+Math.random()*9000);

 a.innerHTML=`
 <div class="big">
 <div style="font-size:60px">💻</div>
 <h2>FICTIONAL CYBER VAULT</h2>
 <p>Crack the 4-digit arcade code!</p>
 <input id="hackInput"
 maxlength="4"
 inputmode="numeric"
 placeholder="ENTER CODE"
 style="font-size:25px;text-align:center">
 <br><br>
 <button onclick="checkHack()">SUBMIT</button>
 <div id="hackMsg"></div>
 </div>
 `;

 window.checkHack=function(){
  const val=document.getElementById("hackInput").value;
  const msg=document.getElementById("hackMsg");

  if(val==code){
   msg.innerHTML="<h2 class='green'>ACCESS GRANTED! 🔓</h2>";
  }else{
   let correct=0;
   for(let i=0;i<4;i++){
    if(val[i]===String(code)[i])correct++;
   }
   msg.innerHTML=
    `<p class="red">ACCESS DENIED</p>
     <p>${correct} digit(s) in the correct position.</p>`;
  }
 };
}

/* ---------------- PUZZLE ---------------- */

function puzzle(){
 const a=area();
 const number=Math.floor(Math.random()*100)+1;
 let tries=0;

 a.innerHTML=`
 <div class="big">
 <h2>🔢 GUESS THE NUMBER</h2>
 <p>I'm thinking of a number from 1 to 100.</p>
 <input id="guess" type="number" min="1" max="100"
 style="font-size:25px;text-align:center">
 <br><br>
 <button onclick="makeGuess()">GUESS</button>
 <div id="guessMsg"></div>
 </div>
 `;

 window.makeGuess=function(){
  const g=Number(document.getElementById("guess").value);
  tries++;

  const m=document.getElementById("guessMsg");

  if(g===number){
   m.innerHTML=
    `<h2 class="green">🎉 CORRECT!</h2>
     <p>You solved it in ${tries} tries.</p>`;
  }else if(g<number){
   m.innerHTML="<p class='gold'>⬆️ TOO LOW!</p>";
  }else{
   m.innerHTML="<p class='red'>⬇️ TOO HIGH!</p>";
  }
 };
}

/* ---------------- ARCADE ---------------- */

function arcade(){
 const a=area();

 a.innerHTML=`
 <canvas id="game" width="800" height="500"></canvas>
 <div class="big">MOVE WITH WASD / ARROWS • COLLECT GOLD • AVOID RED</div>
 `;

 const c=document.getElementById("game");
 const x=c.getContext("2d");

 let p={x:400,y:250,r:18};
 let gold={x:100,y:100,r:13};
 let enemies=[];

 for(let i=0;i<8;i++){
  enemies.push({
   x:Math.random()*800,
   y:Math.random()*500,
   dx:(Math.random()-.5)*5,
   dy:(Math.random()-.5)*5
  });
 }

 let score=0;
 let keys={};

 document.onkeydown=e=>keys[e.key.toLowerCase()]=true;
 document.onkeyup=e=>keys[e.key.toLowerCase()]=false;

 function draw(){
  x.fillStyle="#02040c";
  x.fillRect(0,0,800,500);

  if(keys["arrowup"]||keys["w"])p.y-=5;
  if(keys["arrowdown"]||keys["s"])p.y+=5;
  if(keys["arrowleft"]||keys["a"])p.x-=5;
  if(keys["arrowright"]||keys["d"])p.x+=5;

  p.x=Math.max(18,Math.min(782,p.x));
  p.y=Math.max(18,Math.min(482,p.y));

  enemies.forEach(e=>{
   e.x+=e.dx;
   e.y+=e.dy;

   if(e.x<0||e.x>800)e.dx*=-1;
   if(e.y<0||e.y>500)e.dy*=-1;

   x.fillStyle="#ff174f";
   x.shadowBlur=15;
   x.shadowColor="#ff174f";
   x.beginPath();
   x.arc(e.x,e.y,13,0,Math.PI*2);
   x.fill();
   x.shadowBlur=0;

   if(Math.hypot(p.x-e.x,p.y-e.y)<p.r+13){
    alert("💥 GAME OVER! Score: "+score);
    closeGame();
   }
  });

  if(Math.hypot(p.x-gold.x,p.y-gold.y)<p.r+gold.r){
   score++;
   gold.x=30+Math.random()*740;
   gold.y=30+Math.random()*440;
  }

  x.fillStyle="#ffd21f";
  x.shadowBlur=20;
  x.shadowColor="#ffd21f";
  x.beginPath();
  x.arc(gold.x,gold.y,gold.r,0,Math.PI*2);
  x.fill();
  x.shadowBlur=0;

  x.fillStyle="#00eaff";
  x.shadowBlur=25;
  x.shadowColor="#00eaff";
  x.beginPath();
  x.arc(p.x,p.y,p.r,0,Math.PI*2);
  x.fill();
  x.shadowBlur=0;

  x.fillStyle="#fff";
  x.font="23px Arial";
  x.fillText("SCORE: "+score,20,30);

  gameLoop=requestAnimationFrame(draw);
 }
 draw();
}

/* ---------------- STRATEGY ---------------- */

function strategy(){
 const a=area();

 a.innerHTML=`
 <canvas id="game" width="800" height="500"></canvas>
 <div class="big">🛡️ CLICK TO BUILD TOWERS • STOP THE RED ENEMIES</div>
 `;

 const c=document.getElementById("game");
 const x=c.getContext("2d");

 let towers=[];
 let enemies=[];
 let money=100;
 let lives=10;

 c.onclick=e=>{
  const r=c.getBoundingClientRect();
  const tx=(e.clientX-r.left)*c.width/r.width;
  const ty=(e.clientY-r.top)*c.height/r.height;

  if(money>=20){
   towers.push({x:tx,y:ty});
   money-=20;
  }
 };

 setInterval(()=>{
  enemies.push({
   x:0,
   y:100+Math.random()*300,
   hp:3,
   speed:1+Math.random()*1.5
  });
 },900);

 function draw(){
  x.fillStyle="#040711";
  x.fillRect(0,0,800,500);

  x.strokeStyle="#15255b";
  for(let i=0;i<800;i+=50){
   x.beginPath();
   x.moveTo(i,0);
   x.lineTo(i,500);
   x.stroke();
  }

  for(let i=0;i<500;i+=50){
   x.beginPath();
   x.moveTo(0,i);
   x.lineTo(800,i);
   x.stroke();
  }

  towers.forEach(t=>{
   x.fillStyle="#00eaff";
   x.shadowBlur=20;
   x.shadowColor="#00eaff";
   x.beginPath();
   x.arc(t.x,t.y,18,0,Math.PI*2);
   x.fill();
   x.shadowBlur=0;

   enemies.forEach(e=>{
    if(Math.hypot(t.x-e.x,t.y-e.y)<130){
     e.hp-=.04;
     x.strokeStyle="#00eaff";
     x.beginPath();
     x.moveTo(t.x,t.y);
     x.lineTo(e.x,e.y);
     x.stroke();
    }
   });
  });

  enemies.forEach(e=>{
   e.x+=e.speed;

   x.fillStyle="#ff174f";
   x.beginPath();
   x.arc(e.x,e.y,12,0,Math.PI*2);
   x.fill();

   if(e.x>800){
    e.x=-20;
    lives--;
   }

   if(e.hp<=0){
    e.x=-100;
    money+=10;
   }
  });

  x.fillStyle="#fff";
  x.font="22px Arial";
  x.fillText("💰 "+money,20,30);
  x.fillText("❤️ "+lives,700,30);

  if(lives<=0){
   alert("DEFENSE FAILED!");
   closeGame();
  }

  gameLoop=requestAnimationFrame(draw);
 }
 draw();
}

/* ---------------- SPORTS ---------------- */

function sports(){
 const a=area();

 a.innerHTML=`
 <canvas id="game" width="800" height="500"></canvas>
 <div class="big">🏆 CLICK THE MOVING BALL!</div>
 `;

 const c=document.getElementById("game");
 const x=c.getContext("2d");

 let ball={
  x:400,y:250,r:28,
  dx:5,dy:4
 };
 let score=0;
 let time=20;

 c.onclick=e=>{
  const r=c.getBoundingClientRect();
  const mx=(e.clientX-r.left)*800/r.width;
  const my=(e.clientY-r.top)*500/r.height;

  if(Math.hypot(mx-ball.x,my-ball.y)<ball.r){
   score++;
   ball.dx*=1.05;
   ball.dy*=1.05;
  }
 };

 const timer=setInterval(()=>{
  time--;
  if(time<=0){
   clearInterval(timer);
   alert("🏆 FINAL SCORE: "+score);
   closeGame();
  }
 },1000);

 function draw(){
  x.fillStyle="#07110a";
  x.fillRect(0,0,800,500);

  x.strokeStyle="#00ff95";
  x.lineWidth=4;
  x.strokeRect(20,20,760,460);

  ball.x+=ball.dx;
  ball.y+=ball.dy;

  if(ball.x<ball.r||ball.x>800-ball.r)ball.dx*=-1;
  if(ball.y<ball.r||ball.y>500-ball.r)ball.dy*=-1;

  x.fillStyle="#ffe44d";
  x.shadowBlur=25;
  x.shadowColor="#ffe44d";
  x.beginPath();
  x.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  x.fill();
  x.shadowBlur=0;

  x.fillStyle="#fff";
  x.font="24px Arial";
  x.fillText("SCORE: "+score,30,50);
  x.fillText("TIME: "+time,680,50);

  gameLoop=requestAnimationFrame(draw);
 }
 draw();
}

/* ---------------- GAME SELECTOR ---------------- */

function startGame(type){
 if(window.gameLoop)cancelAnimationFrame(window.gameLoop);

 if(type==="racing")racing();
 else if(type==="shooting")shooting();
 else if(type==="maze")maze();
 else if(type==="reaction")reaction();
 else if(type==="hacker")hacker();
 else if(type==="puzzle")puzzle();
 else if(type==="arcade")arcade();
 else if(type==="strategy")strategy();
 else if(type==="sports")sports();
}

render();

// NitroArcade deep-link: launch a selected Ultra Gaming Arcade title.
window.addEventListener('load',()=>{const n=new URLSearchParams(location.search).get('game');if(n!==null && /^\d+$/.test(n)){const i=Number(n);if(i>=1&&i<=games.length)openGame(i);}});
</script>

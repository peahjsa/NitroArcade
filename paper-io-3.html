<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper.io 3 | NitroArcade</title><style>*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:white;font-family:system-ui,sans-serif}
#stage{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#000}
#stage:fullscreen{width:100%;height:100%}
#game{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;transform-origin:center center;background:black}
#gear{position:absolute;z-index:20;right:12px;top:12px;width:42px;height:42px;border:1px solid #a38eff;border-radius:11px;color:white;background:#3e2689;font-size:21px;cursor:pointer}
#panel{position:absolute;z-index:21;right:12px;top:64px;width:min(320px,calc(100vw - 24px));padding:16px;border:1px solid #a38eff;border-radius:13px;background:#191032f5;max-height:calc(100% - 75px);overflow:auto}
#panel[hidden]{display:none}
#panel h2{font-size:18px;margin:0 0 12px}
#panel button,#panel a{display:inline-block;background:#6347bb;color:white;border:1px solid #ae98ff;border-radius:8px;padding:9px;margin:3px;font:12px system-ui;text-decoration:none;cursor:pointer}
#panel label{display:block;font-size:12px;margin:14px 0}
#panel input{width:100%;display:block;margin-top:7px;accent-color:#b99dff}
#panel small{color:#d0c4ef;font-size:11px;line-height:1.6;display:block;margin-top:12px}</style></head>
<body><div id="stage">
<iframe id="game" title="Paper.io 3" src="https://www.minijuegos.com/embed/paper-io-3" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
<button id="gear" aria-label="Settings">⚙</button>
<section id="panel" hidden>
<h2>Paper.io 3</h2>
<button id="fullscreen">⛶ Fullscreen</button>
<button id="full">Full Page</button>
<button id="crop">Crop</button>
<label>Zoom<input id="zoom" type="range" min="1" max="3" step=".05" value="1"></label>
<label>Horizontal<input id="offsetx" type="range" min="-700" max="700" value="0"></label>
<label>Vertical<input id="offsety" type="range" min="-700" max="700" value="0"></label>
<button id="reset">Reset</button><button id="reload">Reload</button>
<a href="https://www.minijuegos.com/juego/paper-io-3" target="_blank" rel="noopener noreferrer">Open Original</a>
<small>Internet required. If embedding is blocked, open the game on its original website.</small>
</section></div><script>(function(){
'use strict';
const get=id=>document.getElementById(id);
const game=get('game'),zoom=get('zoom'),x=get('offsetx'),y=get('offsety');
function apply(){game.style.transform='translate('+x.value+'px,'+y.value+'px) scale('+zoom.value+')';}
function view(v){zoom.value=v;x.value=0;y.value=0;apply();}
[zoom,x,y].forEach(el=>el.addEventListener('input',apply));
get('full').onclick=()=>view(1);
get('crop').onclick=()=>view(1.3);
get('reset').onclick=()=>view(1);
get('reload').onclick=()=>{game.src=game.src};
get('gear').onclick=()=>{get('panel').hidden=!get('panel').hidden};
get('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await get('stage').requestFullscreen();}catch(e){alert('Try F11 for fullscreen')}};
apply();
})();</script></body></html>
